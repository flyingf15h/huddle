<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>huddle</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #2f6fde; --lock: #c2410c; --ok: #15803d; --hl: #fff4c2; --code: #fbfaf8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9a9892; --line: #34332f;
    --accent: #6b9bf0; --lock: #f0864f; --ok: #4ade80; --hl: #3b3412; --code: #1a1a18;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .grow { flex: 1; }
#conn { font-size: 12px; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
main { display: grid; grid-template-columns: 260px 1fr 320px; height: calc(100vh - 53px); }
section { border-right: 1px solid var(--line); overflow: auto; min-width: 0; }
section:last-child { border-right: 0; display: flex; flex-direction: column; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 14px 6px; }
.item { padding: 6px 14px; cursor: default; }
.item.clickable { cursor: pointer; }
.item.clickable:hover, .item.sel { background: var(--bg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.on { background: var(--ok); }
.sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.lock { color: var(--lock); }
#viewer { display: flex; flex-direction: column; background: var(--panel); }
#vhead { padding: 10px 14px; border-bottom: 1px solid var(--line); }
#code { margin: 0; flex: 1; overflow: auto; background: var(--code); font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; }
#code .ln { display: flex; }
#code .ln span:first-child { width: 48px; flex: none; text-align: right; padding-right: 10px; color: var(--muted); user-select: none; }
#code .ln span:last-child { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 10px; }
#code .ln.hl { background: var(--hl); }
#chat { flex: 1; overflow: auto; padding: 8px 0; }
.msg { padding: 6px 14px; }
.msg b { font-weight: 600; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.ev { padding: 2px 14px; font-size: 12px; color: var(--muted); }
#send { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
#send input#text { flex: 1; min-width: 120px; }
#login { max-width: 420px; margin: 12vh auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 30px; color: var(--muted); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  section { border-right: 0; border-bottom: 1px solid var(--line); max-height: 70vh; }
  #code { min-height: 40vh; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>huddle</h1>
  <p class="sub">Paste an invite code (from <code>huddle invite</code>), or the server token and project name.</p>
  <input id="linvite" placeholder="invite code">
  <p class="sub">or</p>
  <input id="ltoken" placeholder="token">
  <input id="lproject" placeholder="project">
  <input id="lname" placeholder="your name (for chat)">
  <button id="lgo">Open</button>
</div>
<div id="app" hidden>
  <header>
    <h1>huddle</h1>
    <span id="pname" class="sub"></span>
    <span class="grow"></span>
    <span id="conn">connecting…</span>
    <button class="ghost" id="copyinv">Copy invite</button>
    <button class="ghost" id="logout">Switch</button>
  </header>
  <main>
    <section>
      <h2>Agents</h2><div id="agents"></div>
      <h2>Locked files</h2><div id="locks"></div>
      <h2>Shared files</h2><div id="files"></div>
    </section>
    <section id="viewer">
      <div id="vhead" class="sub">Pick a file to watch it live.</div>
      <pre id="code"></pre>
    </section>
    <section>
      <h2>Chat &amp; activity</h2>
      <div id="chat"></div>
      <form id="send">
        <select id="to"><option value="">everyone</option></select>
        <input id="text" placeholder="Message the agents…" autocomplete="off">
        <button>Send</button>
      </form>
    </section>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago'; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

const params = new URLSearchParams(location.hash.slice(1));
let auth = { token: params.get('token') || store.get('huddle.token'), project: params.get('project') || store.get('huddle.project'),
  name: store.get('huddle.name') || 'human' };
if (params.get('invite')) Object.assign(auth, decodeInvite(params.get('invite')) || {});
if (location.hash) history.replaceState(null, '', location.pathname);

function decodeInvite(code) {
  try {
    const j = JSON.parse(atob(code.trim().replace(/^huddle:/, '').replace(/-/g, '+').replace(/_/g, '/')));
    return { token: j.t, project: j.p };
  } catch { return null; }
}

const S = { agents: {}, locks: {}, files: {}, sel: null, content: {}, seq: 0 };
const me = () => ({ id: 'human:' + auth.name, name: auth.name, kind: 'human', host: 'dashboard' });
const api = (ep, body) => fetch(`/api/p/${encodeURIComponent(auth.project)}/${ep}`, {
  method: body ? 'POST' : 'GET',
  headers: { authorization: 'Bearer ' + auth.token, 'content-type': 'application/json' },
  body: body ? JSON.stringify({ agent: me(), ...body }) : undefined,
}).then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.status); return j; }));

function showLogin() { $('app').hidden = true; $('login').hidden = false; $('lname').value = auth.name === 'human' ? '' : auth.name; }
$('lgo').onclick = () => {
  const inv = $('linvite').value && decodeInvite($('linvite').value);
  auth.token = inv ? inv.token : $('ltoken').value.trim();
  auth.project = inv ? inv.project : $('lproject').value.trim();
  auth.name = $('lname').value.trim() || 'human';
  start();
};
$('logout').onclick = () => { store.del('huddle.token'); store.del('huddle.project'); location.reload(); };
$('copyinv').onclick = () => {
  const code = btoa(JSON.stringify({ s: location.origin, t: auth.token, p: auth.project })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  navigator.clipboard.writeText(`npx -y github:flyingf15h/huddle join ${code}`).then(() => { $('copyinv').textContent = 'Copied'; setTimeout(() => $('copyinv').textContent = 'Copy invite', 1500); });
};

function render() {
  // one row per person per checkout; each new Claude session gets a fresh id
  const byKey = {};
  for (const a of Object.values(S.agents).sort((a, b) => b.online - a.online || b.lastSeen - a.lastSeen)) {
    const k = a.name + '|' + (a.checkout || a.id);
    if (!byKey[k]) byKey[k] = a;
  }
  const agents = Object.values(byKey);
  $('agents').innerHTML = agents.map(a => `<div class="item"><span class="dot ${a.online ? 'on' : ''}"></span>${esc(a.name)}
    <span class="sub">${a.kind === 'agent' ? '' : esc(a.kind)}</span><div class="sub">${esc(a.status || (a.online ? 'online' : 'last seen ' + ago(a.lastSeen)))}${a.host ? ' · ' + esc(a.host) : ''}</div></div>`).join('') || '<div class="item sub">nobody yet</div>';
  const locks = Object.values(S.locks);
  $('locks').innerHTML = locks.map(l => `<div class="item clickable ${S.sel === l.path ? 'sel' : ''}" data-p="${esc(l.path)}"><span class="lock">🔒</span> ${esc(l.path)}
    <div class="sub">${esc(l.holderName)} · ${ago(l.since)}${l.note ? ' · ' + esc(l.note) : ''}</div></div>`).join('') || '<div class="item sub">none</div>';
  const files = Object.values(S.files).sort((a, b) => b.at - a.at);
  $('files').innerHTML = files.map(f => `<div class="item clickable ${S.sel === f.path ? 'sel' : ''}" data-p="${esc(f.path)}">${esc(f.path)}
    <div class="sub">v${f.version} by ${esc(f.byName)} · ${ago(f.at)}</div></div>`).join('') || '<div class="item sub">none yet</div>';
  const opts = ['<option value="">everyone</option>'].concat([...new Set(agents.filter(a => a.kind === 'agent').map(a => a.name))].map(n => `<option>${esc(n)}</option>`));
  const cur = $('to').value;
  $('to').innerHTML = opts.join('');
  $('to').value = cur;
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-p]');
  if (el) { S.sel = el.dataset.p; render(); loadFile(S.sel, false); }
});

async function loadFile(p, highlight) {
  try {
    const f = await api('file?path=' + encodeURIComponent(p));
    const old = S.content[p];
    S.content[p] = f.content;
    if (S.sel === p) showFile(f, highlight ? old : null);
  } catch (e) {
    if (S.sel === p) { $('vhead').textContent = p + ' — no edits shared yet'; $('code').innerHTML = ''; }
  }
}
function showFile(f, old) {
  const lock = S.locks[f.path];
  $('vhead').innerHTML = `<b>${esc(f.path)}</b> <span class="sub">v${f.version} · last edit by ${esc(f.byName)} ${ago(f.at)}</span>
    ${lock ? `<span class="lock"> · 🔒 ${esc(lock.holderName)} is editing</span>` : ''}`;
  const lines = f.content.split('\n');
  let a = 0, b = 0;
  if (old != null) {
    const o = old.split('\n');
    while (a < lines.length && a < o.length && lines[a] === o[a]) a++;
    while (b < lines.length - a && b < o.length - a && lines[lines.length - 1 - b] === o[o.length - 1 - b]) b++;
  }
  const hiEnd = lines.length - b;
  $('code').innerHTML = lines.map((l, i) => `<div class="ln ${old != null && i >= a && i < hiEnd ? 'hl' : ''}"><span>${i + 1}</span><span>${esc(l) || ' '}</span></div>`).join('');
  const first = $('code').querySelector('.hl');
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function addChat(html) {
  const c = $('chat');
  const stick = c.scrollTop + c.clientHeight > c.scrollHeight - 40;
  c.insertAdjacentHTML('beforeend', html);
  if (stick) c.scrollTop = c.scrollHeight;
}
function onEvent(ev) {
  switch (ev.type) {
    case 'join': case 'leave': case 'status':
      S.agents[ev.agent.id] = ev.agent;
      if (ev.type === 'status' && ev.agent.status) addChat(`<div class="ev">${esc(ev.agent.name)} is now: ${esc(ev.agent.status)}</div>`);
      if (ev.type === 'join') addChat(`<div class="ev">${esc(ev.agent.name)} joined</div>`);
      break;
    case 'lock': S.locks[ev.lock.path] = ev.lock; addChat(`<div class="ev">🔒 ${esc(ev.lock.holderName)} locked ${esc(ev.lock.path)}</div>`); break;
    case 'unlock': delete S.locks[ev.path]; addChat(`<div class="ev">🔓 ${esc(ev.holderName)} released ${esc(ev.path)}${ev.reason === 'stale' ? ' (timed out)' : ''}</div>`); break;
    case 'file':
      S.files[ev.file.path] = ev.file;
      addChat(`<div class="ev">✎ ${esc(ev.file.byName)} edited ${esc(ev.file.path)} (v${ev.file.version})</div>`);
      if (!S.sel) S.sel = ev.file.path;
      if (S.sel === ev.file.path) loadFile(ev.file.path, true);
      break;
    case 'message': {
      const m = ev.message;
      addChat(`<div class="msg"><b>${esc(m.fromName)}</b>${m.to ? ' → ' + esc(m.to) : ''} <span class="sub">${new Date(m.at).toLocaleTimeString()}</span><div class="text">${esc(m.text)}</div></div>`);
      break;
    }
  }
  render();
}

$('send').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  try { await api('message', { text, to: $('to').value || null }); } catch (err) { addChat(`<div class="ev">send failed: ${esc(err.message)}</div>`); }
};

async function start() {
  if (!auth.token || !auth.project) return showLogin();
  try { await api('hello', {}); } catch (e) { alertLogin(e.message); return; }
  store.set('huddle.token', auth.token); store.set('huddle.project', auth.project); store.set('huddle.name', auth.name);
  $('login').hidden = true; $('app').hidden = false;
  $('pname').textContent = auth.project + ' · you are ' + auth.name;
  const hist = await api('messages?limit=100');
  for (const m of hist.messages) onEvent({ type: 'message', message: m });
  const es = new EventSource(`/api/p/${encodeURIComponent(auth.project)}/events?token=${encodeURIComponent(auth.token)}&since=999999999`);
  es.addEventListener('snapshot', (e) => {
    const s = JSON.parse(e.data);
    S.agents = {}; S.locks = {}; S.files = {};
    for (const a of s.agents) S.agents[a.id] = a;
    for (const l of s.locks) S.locks[l.path] = l;
    for (const f of s.files) if (f.size) S.files[f.path] = f;
    if (!S.sel && s.files.length) { S.sel = (s.locks[0] || s.files[0]).path; loadFile(S.sel, false); }
    render();
  });
  es.onmessage = (e) => onEvent(JSON.parse(e.data));
  es.onopen = () => { $('conn').textContent = 'live'; };
  es.onerror = () => { $('conn').textContent = 'reconnecting…'; };
  setInterval(() => api('hello', {}).catch(() => {}), 60000);
  setInterval(render, 15000);
}
function alertLogin(msg) { showLogin(); $('login').insertAdjacentHTML('beforeend', `<p class="lock">${esc(msg)}</p>`); }
start();
</script>
</body>
</html>
