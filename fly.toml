# Public huddle relay: open mode, so anyone can `huddle new` a project.
app = "huddle-relay"
primary_region = "yyz"

[build]

[env]
  PORT = "7777"
  HUDDLE_OPEN = "1"

[http_service]
  internal_port = 7777
  force_https = true
  # state lives in memory and agents hold long-polls open, so keep exactly one machine up
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

[mounts]
  source = "huddle_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
